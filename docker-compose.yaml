name: openvpn
services:
  openvpn-client:
    image: ghcr.io/frauhottelmann//openvpn-client:latest
    container_name: openvpn-client
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    command: --config /vpn/client.ovpn --askpass /vpn/client.pwd --auth-nocache
    volumes:
      - ./client/:/vpn
    network_mode: "bridge"
    
